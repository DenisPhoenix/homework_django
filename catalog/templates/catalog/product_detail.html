{% extends 'catalog/base.html' %}
{% load my_tags %}

{% block title %}Skystore{% endblock %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Подробная информация о товаре</h1>
</div>
<div class="container">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        <div class="col">
            <div class="card shadow-sm">
                <img src="{{ product.image|media_filter }}" alt="Изображение отсутствует">
                <div class="card-body">
                    <p class="card-text">Название: {{ product.name }}</p>
                    <p class="card-text">Описание: {{ product.description }}</p>
                    <p class="card-text">Цена: {{ product.price }}</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <a role="button" class="btn btn-secondary" href="{% url 'catalog:home' %}">Назад</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
