{% extends 'blog/base.html' %}

{% block title %}Удаление блога{% endblock %}

{% block content %}
<h1 class="mb-4">Удаление</h1>
<p>Вы уверены, что хотите удалить блог "{{ blog.title }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type='submit' class="btn btn-danger">Удалить</button>
    <a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
