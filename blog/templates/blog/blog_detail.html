{% extends 'blog/base.html' %}

{% block title %}Информация о блоге{% endblock %}

{% block content %}
<h1>{{ blog.title }}</h1>
<p>Описание: {{ blog.description }}</p>
<p>Дата публикации: {{ blog.create_at|date:"d M Y"}}</p>
<a href="{% url 'blog:blog_edit' blog.pk %}" class="btn btn-primary">Редактировать</a>
<a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Отмена</a>
<a href="{% url 'blog:blog_delete' blog.pk %}" class="btn btn-danger">Удалить</a>
{% endblock %}
