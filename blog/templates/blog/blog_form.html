{% extends 'blog/base.html' %}

{% block title %}Создание блог{% endblock %}

{% block content %}
<h1 class="mb-4">Создание блог</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type='submit' class="btn btn-primary">Создать</button>
    <a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
