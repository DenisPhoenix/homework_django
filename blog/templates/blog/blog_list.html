{% extends 'blog/base.html' %}

{% block title %}Список блогов{% endblock %}

{% block content %}
<h1 class="mb-4">Список блогов</h1>
<ul class="list-group">
    {% for blog in blogs %}
        <li class="list-group-item">
            <a href="{% url 'blog:blog_detail' blog.pk %}">{{ blog.title }}</a> - {{ blog.create_at|date:"d M Y"}} - {{ blog.counter_view }}
        </li>
    {% endfor %}
</ul>
{% endblock %}
