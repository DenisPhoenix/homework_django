[project]
name = "homework-django"
version = "0.1.0"
description = ""
authors = [
    { name = "name", email = "email@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django (>=6.0.5,<7.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
]

[tool.poetry]
packages = [{ include = "homework_django", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "ipython (>=9.14.1,<10.0.0)",
    "pillow (>=12.2.0,<13.0.0)"
]

[tool.black]
line-length = 79
target-version = ['py314']
exclude = '''
(
  /(
      \.git

    | \.venv
    | build
    | dist
  )/
)
'''

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"
